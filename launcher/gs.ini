# Graphics (RuleOfRose.exe rewrites this from its settings). [gs]: renderer = auto | d3d11 | d3d12 | vulkan | opengl;
# upscale = internal resolution multiplier; texture_filtering = ps2 | forced | nearest.
# Other sections go to PCSX2's GS as they are ([EmuCore/GS]: AspectRatio, fxaa, CASMode + CASSharpness,
# deinterlace_mode, TVShader).
[gs]
renderer = auto
upscale = 2
texture_filtering = ps2

[EmuCore/GS]
AspectRatio = 4:3
fxaa = false
CASMode = 0
CASSharpness = 50
deinterlace_mode = 0
TVShader = 0
